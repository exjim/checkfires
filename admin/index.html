<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23262b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="소방점검">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>body{margin:0}</style>
<title>소방점검 통합 웹앱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 역할 전환 → [사용자] ①고지(법정 비치 기준) ②층별 점검 ③리포트 제출 / [관리자] 모니터링 · 리포트 · 기준 */
:root{--bg:#f6f7f9;--surface:#fff;--ink:#23262b;--mute:#6a7078;--line:#dfe3e8;--blue:#286ef0;--blue-soft:#e8f0fe;--red:#d93a3a;--red-soft:#fdecec;--amber:#b7791f;--amber-soft:#fdf3dc;--green:#1a8a5a;--green-soft:#e2f5ec;--wire:#e9ecf0;--grey:#b9c0c9;--slab:rgba(255,255,255,.72);--slab-edge:#9aa4b0;--stage:#e4e8ee;
--sans:'Noto Sans KR',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--surface:#1c2025;--ink:#e8eaee;--mute:#9aa1ab;--line:#2f353c;--blue:#6b9bff;--blue-soft:#1d2a47;--red:#ff7b7b;--red-soft:#3a2023;--amber:#e6b758;--amber-soft:#3a3120;--green:#4cc38a;--green-soft:#1b3328;--wire:#262b31;--grey:#4a525c;--slab:rgba(40,46,54,.78);--slab-edge:#5b6672;--stage:#101317;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--surface:#1c2025;--ink:#e8eaee;--mute:#9aa1ab;--line:#2f353c;--blue:#6b9bff;--blue-soft:#1d2a47;--red:#ff7b7b;--red-soft:#3a2023;--amber:#e6b758;--amber-soft:#3a3120;--green:#4cc38a;--green-soft:#1b3328;--wire:#262b31;--grey:#4a525c;--slab:rgba(40,46,54,.78);--slab-edge:#5b6672;--stage:#101317;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;padding-block:0 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin-inline:auto}
.toapp{display:inline-block;padding:9px 14px;border-radius:10px;background:#1a56db;color:#fff;font-weight:600;text-decoration:none;font-size:14px}.toapp:hover{background:#1647b8}.applogo{width:48px;height:48px;border-radius:14px;background:#1a56db;display:grid;place-items:center;flex:none;transition:transform .2s,box-shadow .2s}.applogo svg{width:28px;height:28px;fill:#fff;overflow:visible}.applogo .fl{transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite}.applogo:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 6px 16px rgba(26,86,219,.4)}@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08,1.12) rotate(-3deg)}60%{transform:scale(.96,1.04) rotate(3deg)}}@media(prefers-reduced-motion:reduce){.applogo .fl{animation:none}}
header.top{padding-block:22px 10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
header.top h1{font-size:clamp(20px,3.4vw,28px);line-height:1.25;margin:0;font-weight:900;text-wrap:balance}
.kick{font:500 11.5px var(--mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--mute);font:500 14px var(--sans);padding:9px 16px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.steps{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);padding-block:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;margin-inline:-16px;padding-inline:16px}
.steps button{flex:none;border:0;background:transparent;color:var(--mute);font:500 14px var(--sans);padding:9px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg)}
.steps button:disabled{opacity:.4;cursor:not-allowed}
main{padding-top:18px;display:grid;gap:16px}
h2{font-size:21px;margin:0 0 4px;font-weight:900;text-wrap:balance}
h3{font-size:15.5px;margin:0 0 8px}
.lead{color:var(--mute);margin:0 0 6px;max-width:76ch;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.notice{border-left:3px solid var(--amber);background:var(--amber-soft);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}
.notice.blue{border-color:var(--blue);background:var(--blue-soft)}
.notice.red{border-color:var(--red);background:var(--red-soft)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);background:var(--bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:38px;max-width:100%}
input[type=number]{width:92px}
textarea{width:100%;min-height:56px;resize:vertical}
label.cb{display:flex;gap:8px;align-items:flex-start;font-size:14px}
label.cb input{margin-top:5px;width:18px;height:18px;flex:none}
.pill{display:inline-block;font:500 11px var(--mono);padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--green-soft);color:var(--green)}.p-warn{background:var(--amber-soft);color:var(--amber)}.p-bad{background:var(--red-soft);color:var(--red)}.p-no{background:var(--wire);color:var(--mute)}.p-blue{background:var(--blue-soft);color:var(--blue)}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:9px;padding:10px 16px;font:700 14px var(--sans);cursor:pointer;min-height:42px}
.btn.bad{background:var(--red);color:#fff;border:1px solid var(--red)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:var(--blue);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
.mx td.n{text-align:center;font-weight:700;white-space:nowrap}
.mx td.na{text-align:center;color:var(--mute);background:var(--bg);font-size:12px}
.ins{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.ins{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:12px;position:sticky;top:64px}
@media(max-width:860px){.side{position:static}}
.iso{width:100%;max-width:230px;margin-inline:auto;display:block}
.iso polygon{cursor:pointer;stroke-width:1.5}
.fl-list{display:grid;gap:6px}
.fl-list button{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
.fl-list button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.bar{height:5px;background:var(--wire);border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;background:var(--green)}
.item{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item.na{opacity:.6}
.item>header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.item>header b{font-size:15px}
.item .body{padding:12px 14px;display:grid;gap:10px}
.qrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ck{border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.ck .q{font-size:13.5px;margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opts{display:flex;gap:6px}
.opts button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:7px;padding:6px 4px;font:500 13px var(--sans);cursor:pointer;min-height:36px}
.opts button[aria-pressed="true"].o1,.opts button[aria-pressed="true"].y{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opts button[aria-pressed="true"].o2{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.opts button[aria-pressed="true"].o3,.opts button[aria-pressed="true"].n{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.opts button:disabled{opacity:.45;cursor:not-allowed}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--wire)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.addph{display:inline-flex;gap:6px;flex-wrap:wrap}
.addph label{cursor:pointer}
.small{font-size:12.5px;color:var(--mute)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.15}.kpi span{font-size:12.5px;color:var(--mute)}
.heat{display:inline-block;min-width:46px;text-align:center;font:700 12px var(--mono);padding:4px 6px;border-radius:6px}
.h-ok{background:var(--green-soft);color:var(--green)}.h-warn{background:var(--amber-soft);color:var(--amber)}.h-bad{background:var(--red-soft);color:var(--red)}.h-no{background:var(--wire);color:var(--mute)}.h-prog{background:var(--blue-soft);color:var(--blue)}
.list{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.lrow[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.dfx{display:grid;gap:8px}
.df{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:100;padding:20px}
.lb img{max-width:100%;max-height:86vh;border-radius:10px;background:#fff}
.lb button{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:16px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tag{font:500 10.5px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px}

.v3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.v3{grid-template-columns:minmax(0,1fr)}}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px;font-size:13px}
.ctl label{display:inline-flex;gap:6px;align-items:center;color:var(--mute)}
.ctl input[type=range]{width:100px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:99px;padding:5px 11px;font:500 12.5px var(--sans);cursor:pointer;min-height:32px}
.chip[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{position:relative;height:440px;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden;perspective:1400px;touch-action:none;cursor:grab;user-select:none}
@media(max-width:520px){.stage{height:340px}}
.stage .hint{position:absolute;left:10px;bottom:8px;font:500 11px var(--mono);color:var(--mute);z-index:5;pointer-events:none}
.scene{position:absolute;left:50%;top:52%;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--sc,1)) rotateX(var(--rx,58deg)) rotateZ(var(--rz,-35deg))}
.fl{position:absolute;left:-150px;top:-100px;width:300px;height:200px;transform-style:preserve-3d;background:var(--slab);border:2px solid var(--slab-edge);border-radius:6px;transition:transform .35s,background .2s,border-color .2s}
.fl.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.fl.dim{background:transparent;border-color:var(--line);border-style:dashed}
.fl .rm{position:absolute;border:1.5px solid var(--slab-edge)}
.fl.dim .rm{border-color:var(--line)}
.fl .stc{position:absolute;right:8px;top:8px;width:34px;height:56px;border:1.5px solid var(--slab-edge);background:repeating-linear-gradient(0deg,var(--slab-edge) 0 1px,transparent 1px 7px);opacity:.7}
.fl .fn{position:absolute;left:-46px;top:6px;font:700 13px var(--mono);color:var(--ink);transform:rotateZ(35deg);transform-origin:left top;white-space:nowrap}
.fl.dim .fn{color:var(--mute)}
.mk{position:absolute;width:28px;height:28px;margin:0;padding:0;border-radius:50%;border:2.5px solid var(--slab-edge);background:var(--surface);color:var(--ink);font:700 11px var(--sans);display:grid;place-items:center;cursor:pointer;transform:translate3d(-50%,-50%,14px) rotateZ(calc(var(--rz,-35deg)*-1)) rotateX(calc(var(--rx,58deg)*-1));box-shadow:0 2px 0 rgba(0,0,0,.18)}
.mk.s-ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.mk.s-warn{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.mk.s-bad{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.mk.cur{outline:3px solid var(--blue);outline-offset:2px}
.mk.off{opacity:.4}
.item.focus{outline:3px solid var(--blue);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.col{background:var(--bg);border:1px dashed var(--grey);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-height:140px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px}
.tk.req{border-color:var(--amber)}
.sm-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card.newc{border-color:var(--blue)}
.ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
input[type=text],input[type=password],input[type=date],input[type=tel]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:42px;width:100%;max-width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fld{display:grid;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.fld>span{font-weight:500}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.login{max-width:420px;margin:28px auto 0;display:grid;gap:14px}
.login h2{margin:0}
.msg{font-size:13.5px;padding:9px 12px;border-radius:8px;background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green)}
.msg.info{background:var(--blue-soft);color:var(--blue)}
.ubar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.ubar b{font-size:14px}
.sigpad{display:block;width:100%;max-width:420px;height:130px;touch-action:none;border:1px dashed var(--grey);border-radius:8px;background:#fff;cursor:crosshair}
.banner{padding:8px 12px;font-size:12.5px;border-radius:8px;background:var(--amber-soft);color:var(--amber);margin-top:6px}
.tk .row{gap:6px}
code{font-family:var(--mono);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div style="display:flex;align-items:center;gap:12px"><a href="/" class="applogo" title="소방안전점검 앱으로 이동" aria-label="소방안전점검 앱으로 이동"><svg viewBox="0 0 24 24"><path class="fl" d="M12.5 2c.7 3.6 4.6 5.4 4.6 10.2A5.1 5.1 0 0 1 12 17.3a5.1 5.1 0 0 1-5.1-5.1c0-2 1-3.5 2.3-4.7.1 1.8.9 2.9 2 3.3-.5-3.5-.2-6.2 1.3-8.8z"/><path d="M12 19.3c2.9 0 5.2-1.1 6.6-2.7.6 3-1.9 5.4-6.6 5.4s-7.2-2.4-6.6-5.4c1.4 1.6 3.7 2.7 6.6 2.7z"/></svg></a><div><div class="kick">Faircode · 소방안전 점검 · 모니터링</div><h1>소방점검 통합 웹앱</h1></div></div>
  <a href="/" class="toapp">📱 소방안전점검 앱으로 돌아가기</a>
  <div class="ubar" id="userbar"></div>
</header>
<nav class="steps" id="steps" aria-label="메뉴"></nav>
<main id="view"></main>
</div>
<div id="lbx"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const pad=x=>String(x).padStart(2,'0');
const rnd=()=>Math.random().toString(36).slice(2,6);
const today=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())};
const stamp=()=>{const n=new Date();return pad(n.getMonth()+1)+'/'+pad(n.getDate())+' '+pad(n.getHours())+':'+pad(n.getMinutes())};
const ROLES={inspector:'점검자',admin:'관리자',owner:'건물주'};
const RKEY={inspector:'user',admin:'admin',owner:'owner'};
const ID_RE=/^[a-z0-9._-]{3,20}$/;

/* ================= 데이터 계층 =================
   Firebase(Auth+Firestore)가 연결되면 서버에 저장하고, 연결이 없으면(로컬 실행 등) 이 기기 안에만 저장합니다. */
const A={user:null,mode:'',init:null,blds:[],jobs:[],reports:[],users:[],un:[],err:'',fbErr:''};
let D=null;
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(_){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h}}
function emsg(e){
 const c=(e&&e.code)||'';
 if(/invalid-credential|user-not-found|wrong-password|invalid-login/.test(c))return'아이디 또는 비밀번호가 올바르지 않습니다.';
 if(c==='auth/email-already-in-use')return'이미 사용 중인 아이디입니다.';
 if(c==='auth/weak-password')return'비밀번호는 6자 이상이어야 합니다.';
 if(c==='auth/operation-not-allowed')return'Firebase 콘솔에서 "이메일/비밀번호" 로그인을 사용 설정해야 합니다.';
 if(c==='auth/too-many-requests')return'시도가 너무 많습니다. 잠시 후 다시 시도하세요.';
 if(c==='auth/requires-recent-login')return'보안을 위해 다시 로그인한 뒤 변경하세요.';

const matchW=(d,w)=>(w||[]).every(x=>d[x[0]]===x[2]);

const Local=(()=>{
 let mem=null;const subs=[];
 const load=()=>{if(mem)return mem;try{mem=JSON.parse(localStorage.getItem('fa-db')||'{}')}catch(_){mem={}}if(!mem||typeof mem!=='object')mem={};['users','buildings','jobs','reports','meta'].forEach(c=>mem[c]=mem[c]||{});return mem};
 const save=()=>{try{localStorage.setItem('fa-db',JSON.stringify(mem))}catch(e){throw new Error('이 기기의 저장 공간이 부족합니다. 사진 수를 줄이거나 Firebase 서버 연결을 사용하세요.')}};
 const pub=u=>{const o=Object.assign({},u);delete o.hash;return o};
 const rows=(c,w)=>Object.values(load()[c]).filter(d=>matchW(d,w)).map(d=>c==='users'?pub(d):d);
 const notify=c=>subs.filter(s=>s.c===c).forEach(s=>s.run());
 addEventListener('storage',e=>{if(e.key==='fa-db'){mem=null;['users','buildings','jobs','reports'].forEach(notify)}});
 const api={
  async init(){load();return'local'},
  async initialized(){return!!load().meta.init},
  async createUser(o){
   const d=load();if(Object.values(d.users).some(u=>u.id===o.id))throw new Error('이미 사용 중인 아이디입니다.');

   save();notify('users');return pub(d.users[uid]);
  },
  async bootstrap(o){const d=load();if(d.meta.init)throw new Error('이미 초기 설정이 끝났습니다.');const u=await api.createUser(Object.assign({},o,{role:'admin'}));d.meta.init={at:Date.now()};save();localStorage.setItem('fa-sess',u.uid);return u},
  async login(id,pw){const d=load();const u=Object.values(d.users).find(x=>x.id===id);if(!u||u.hash!==await sha(pw))throw new Error('아이디 또는 비밀번호가 올바르지 않습니다.');if(!u.active)throw new Error('사용이 중지된 계정입니다. 관리자에게 문의하세요.');localStorage.setItem('fa-sess',u.uid);return pub(u)},
  async restore(){const d=load();const u=d.users[localStorage.getItem('fa-sess')||''];return u&&u.active?pub(u):null},
  async logout(){localStorage.removeItem('fa-sess')},
  async changePw(pw){const d=load();const u=d.users[A.user.uid];if(pw.length<6)throw new Error('비밀번호는 6자 이상이어야 합니다.');u.hash=await sha(pw);save()},
  async list(c,w){return rows(c,w)},
  async set(c,id,data){load()[c][id]=clone(data);save();notify(c)},
  async update(c,id,patch){const d=load()[c];if(!d[id])throw new Error('대상을 찾을 수 없습니다.');Object.assign(d[id],clone(patch));save();notify(c)},
  async del(c,id){delete load()[c][id];save();notify(c)},
  watch(c,w,cb){const s={c,run:()=>cb(rows(c,w))};subs.push(s);setTimeout(s.run,0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}}
 };

const FB=(()=>{
 let auth=null,fs=null;const V='10.14.1';
 const em=id=>id+'@checkfires.app';
 const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Firebase 스크립트를 불러오지 못했습니다'));document.head.appendChild(s)});
 const q=(c,w)=>{let r=fs.collection(c);(w||[]).forEach(x=>{r=r.where(x[0],x[1],x[2])});return r};
 const prof=async uid=>{const d=await fs.collection('users').doc(uid).get();return d.exists?d.data():null};
 const api={
  async init(){
   const r=await fetch('/__/firebase/init.json',{cache:'no-store'});
   if(!r.ok)throw new Error('Firebase 웹 앱 구성(init.json)을 찾을 수 없습니다 (HTTP '+r.status+')');
   const cfg=await r.json();if(!cfg||!cfg.apiKey)throw new Error('Firebase 구성값이 비어 있습니다');
   for(const m of['app','auth','firestore'])await loadScript('https://www.gstatic.com/firebasejs/'+V+'/firebase-'+m+'-compat.js');
   firebase.initializeApp(cfg);auth=firebase.auth();fs=firebase.firestore();return'firebase';
  },
  async initialized(){return(await fs.collection('meta').doc('init').get()).exists},
  async bootstrap(o){
   const c=await auth.createUserWithEmailAndPassword(em(o.id),o.pw);const uid=c.user.uid;
   const u={uid,id:o.id,name:o.name,role:'admin',phone:'',active:true,createdAt:Date.now()};
   const b=fs.batch();b.set(fs.collection('users').doc(uid),u);b.set(fs.collection('meta').doc('init'),{at:Date.now(),by:uid});
   try{await b.commit()}catch(e){try{await c.user.delete()}catch(_){}throw e}
   return u;
  },
  async createUser(o){
   let sec=firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(firebase.app().options,'sec');
   const c=await sec.auth().createUserWithEmailAndPassword(em(o.id),o.pw);const uid=c.user.uid;
   const u={uid,id:o.id,name:o.name,role:o.role,phone:o.phone||'',active:true,createdAt:Date.now()};
   try{await fs.collection('users').doc(uid).set(u)}catch(e){try{await c.user.delete()}catch(_){}await sec.auth().signOut();throw e}
   await sec.auth().signOut();return u;
  },
  async login(id,pw){
   const c=await auth.signInWithEmailAndPassword(em(id),pw);const p=await prof(c.user.uid);
   if(!p){await auth.signOut();throw new Error('계정 정보가 없습니다. 관리자에게 문의하세요.')}
   if(!p.active){await auth.signOut();throw new Error('사용이 중지된 계정입니다. 관리자에게 문의하세요.')}
   return p;
  },
  restore(){return new Promise(res=>{const un=auth.onAuthStateChanged(async u=>{un();if(!u)return res(null);try{const p=await prof(u.uid);if(p&&p.active)return res(p);await auth.signOut()}catch(_){}res(null)})})},
  async logout(){await auth.signOut()},
  async changePw(pw){await auth.currentUser.updatePassword(pw)},
  async list(c,w){return(await q(c,w).get()).docs.map(d=>d.data())},
  async set(c,id,data){await fs.collection(c).doc(id).set(clone(data))},
  async update(c,id,patch){await fs.collection(c).doc(id).update(clone(patch))},
  async del(c,id){await fs.collection(c).doc(id).delete()},
  watch(c,w,cb){return q(c,w).onSnapshot(s=>cb(s.docs.map(d=>d.data())),e=>cb(null,e))}
 };
 return api;
})();

  list.push({k:'door',q:S.stairs,note:'피난계단 출입문 '+S.stairs});
  let spr=false,why='';
  const sub=U.spr.sub;
  if(U.spr.total&&T>=U.spr.total){spr=true;why='연면적/합계 '+T+'㎡ ≥ '+U.spr.total}
  else if((isUnder(f)||fnum(f)>=4)&&a>=sub){spr=true;why='지하·4층 이상 층 '+a+'㎡ ≥ '+sub}
  list.push({k:'spr',q:spr?undefined:null,na:!spr&&'대상 아님 (지하·4층 이상 층 '+sub+'㎡ 미만)',note:spr?why+' · 헤드 전수 확인':''});
  let hyd=false,hw='';
  if(T>=3000){hyd=true;hw='연면적 '+T+'㎡ ≥ 3,000'}else if((isUnder(f)||fnum(f)>=4)&&a>=600){hyd=true;hw='지하·4층 이상 층 '+a+'㎡ ≥ 600'}
  list.push({k:'hyd',q:hyd?1:null,na:!hyd&&'대상 아님',note:hyd?hw:''});
  if(fnum(f)>=3&&fnum(f)<=10)list.push({k:'desc',q:1,note:'3~10층 층마다'});
  out[f]=list.sort((x,y)=>ORDER.indexOf(x.k)-ORDER.indexOf(y.k));
 });
 return out;
}
function judge(f,it){
 if(it.na)return{done:true,st:'na'};
 const r=rec(f,it.k);
 if(r.has===null)return{done:false,st:'todo'};
 if(r.has==='no')return{done:true,st:'miss',kind:'미비치',detail:'비치 없음'};
 const found=r.qty===''?null:+r.qty;
 if(it.q&&found===null)return{done:false,st:'todo'};
 if(r.r.some(v=>v===0))return{done:false,st:'todo'};
 if(it.q&&found<it.q)return{done:true,st:'short',kind:'수량 부족',detail:'필요 '+it.q+' / 확인 '+found};
 const bad=[],warn=[];CK[it.k].c.forEach((c,i)=>{if(r.r[i]===3)bad.push(c[0]);if(r.r[i]===2)warn.push(c[0])});
 if(bad.length)return{done:true,st:'bad',kind:'동작·상태 불량',detail:bad.join(', ')};
 if(warn.length)return{done:true,st:'warn',kind:'보수 필요',detail:warn.join(', ')};
 return{done:true,st:'ok'};
}
const RANK={na:0,ok:1,warn:2,bad:3,short:4,miss:4,todo:-1};
function summarize(){
 const req=required(),res={};
 FL.forEach(f=>{
  const items=req[f].map(it=>{const j=judge(f,it);return Object.assign({it,f},j)});
  const live=items.filter(x=>x.st!=='na');
  const done=live.filter(x=>x.done).length;
  let worst='ok';live.filter(x=>x.done).forEach(x=>{if(RANK[x.st]>RANK[worst])worst=x.st});
  const fs=live.length&&done<live.length?(done?'prog':'todo'):(worst==='short'||worst==='miss'?'bad':worst);
  res[f]={items,done,n:live.length,state:fs};
 });
 return res;
}
const defects=sm=>{const d=[];FL.forEach(f=>sm[f].items.forEach(x=>{if(['miss','short','bad','warn'].includes(x.st))d.push({f,k:x.it.k,name:CK[x.it.k].n,st:x.st,kind:x.kind,detail:x.detail,photos:rec(f,x.it.k).photos.slice(),note:rec(f,x.it.k).note||'',req:x.it.q||0,found:rec(f,x.it.k).qty})}));return d};
const needPhoto=x=>['miss','short','bad'].includes(x.st);
function readiness(sm){
 let open=0,nophoto=0;
 FL.forEach(f=>sm[f].items.forEach(x=>{if(x.st==='na')return;if(!x.done)open++;else if(needPhoto(x)&&!rec(f,x.it.k).photos.length)nophoto++}));
 return{open,nophoto,ok:open===0&&nophoto===0};
}

let geoId=null;
const hav=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function stopGeo(){if(geoId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(geoId);geoId=null}
function startGeo(b){
 stopGeo();S.dist=null;S.acc=null;
 if(b.lat==null||b.lng==null||b.lat===''||b.lng===''){S.gps=true;S.locMsg='건물 좌표가 설정되지 않아 위치 제한이 없습니다.';return}
 if(!navigator.geolocation){S.gps=false;S.locMsg='이 기기는 위치 확인을 지원하지 않아 점검 입력이 잠깁니다.';return}
 S.gps=false;S.locMsg='현장 위치를 확인하는 중…';
 geoId=navigator.geolocation.watchPosition(p=>{
  const was=S.gps;S.dist=Math.round(hav(p.coords.latitude,p.coords.longitude,+b.lat,+b.lng));S.acc=Math.round(p.coords.accuracy);
  S.gps=S.dist<=(+b.radius||100);S.locMsg='현재 건물에서 '+S.dist+' m · 정확도 ±'+S.acc+' m'+(S.gps?'':' — '+(+b.radius||100)+' m 밖이라 열람만 가능합니다');
  const el=$('#locmsg');if(el)el.textContent=S.locMsg;if(was!==S.gps)render();
 },e=>{const was=S.gps;S.gps=false;S.locMsg=e.code===1?'위치 권한이 거부되었습니다. 브라우저 설정에서 위치를 허용하세요.':'위치를 확인하지 못했습니다.';const el=$('#locmsg');if(el)el.textContent=S.locMsg;if(was)render()},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}

 const d=loadDraft(j.id);
 if(d){INSP=d.insp||{};S.ack=!!d.ack;if(FL.includes(d.floor))S.floor=d.floor}
 else if(j.insp){INSP=clone(j.insp);Object.keys(INSP).forEach(f=>Object.keys(INSP[f]).forEach(k=>{INSP[f][k].photos=[]}))}

document.addEventListener('pointermove',e=>{if(!sg)return;const x=sg.getContext('2d'),p=sgPos(e,sg);x.lineTo(p[0],p[1]);x.stroke()});

const mkFloors=(g,u)=>{const o=[];for(let i=g;i>=1;i--)o.push(i+'F');for(let i=1;i<=u;i++)o.push('B'+i);return o};
function newBF(){return{id:'',name:'',address:'',use:'근린생활시설',fire2:true,stairs:2,ground:4,under:1,areas:{'4F':300,'3F':300,'2F':300,'1F':420,'B1':300},ownerUid:'',lat:'',lng:'',radius:100}}
/* ================= 건축물대장 검색 (건물 등록 시 주소로 찾기) =================
   데이터: ledger.b64 (근린생활·판매·업무·숙박·위락·문화집회·운동·의료·관광휴게 시설이 있는 대지). 처음 검색할 때만 내려받는다. */
const LG=(()=>{
 let G,U,E,R,FD=[],FUs=[],gS=[],gE=[],roadIdx=null,loading=null;
 const useKey=m=>/근린생활|소매/.test(m)?'근린생활시설':/판매/.test(m)?'판매시설':/업무/.test(m)?'업무시설':/숙박/.test(m)?'숙박시설':/위락/.test(m)?'위락시설':/문화|집회/.test(m)?'공연장·집회시설':/의료/.test(m)?'의료시설':'그 밖의 용도';
 const addr=r=>G[r[0]]+' '+(r[3]?'산':'')+r[1]+(r[2]?'-'+r[2]:'')+'번지';
 const sgg=g=>G[g].split(' ').slice(0,-1).join(' ');
 async function load(){
  if(R)return;
  if(!loading)loading=(async()=>{
   if(typeof DecompressionStream==='undefined')throw new Error('이 브라우저는 압축 데이터를 풀 수 없습니다. 최신 Chrome·Edge·Safari에서 사용하세요.');
   const r=await fetch('ledger.b64');if(!r.ok)throw new Error('건축물대장 데이터를 불러오지 못했습니다 (HTTP '+r.status+')');
   const b64=(await r.text()).trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
   const d=JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
   G=d.g;U=d.u;E=d.e;FD=d.f||[];FUs=d.fu||[];R=d.r;
   for(let i=0;i<R.length;i++){const g=R[i][0];if(gS[g]===undefined)gS[g]=i;gE[g]=i+1}
  })().catch(e=>{loading=null;throw e});
  return loading;
 }
 function buildRoadIdx(){if(roadIdx)return;roadIdx=new Map();
  for(let i=0;i<R.length;i++){const rd=R[i][4];if(!rd)continue;const nm=rd.split(' ')[0];let a=roadIdx.get(nm);if(!a)roadIdx.set(nm,a=[]);a.push(i)}}
 function parseQ(q){
  const toks=q.trim().replace(/\s+/g,' ').split(' ').filter(Boolean);let lot=null,rest=toks;
  if(toks.length){const m=toks[toks.length-1].match(/^(산)?(\d+)(?:-(\d+))?(?:번지|번)?$/);
   if(m){lot={san:m[1]?1:0,bun:+m[2],ji:+(m[3]||0)};rest=toks.slice(0,-1)}}
  if(rest.length&&rest[rest.length-1]==='산'){if(lot)lot.san=1;rest=rest.slice(0,-1)}
  return{lot,rest,raw:q.trim()};
 }
 const isRoad=t=>/(로|길)(\d+(번길)?)?$/.test(t)&&t.length>=2;
 const isDong=t=>/(동|읍|면|리|가)$/.test(t)&&t.length>=2&&!isRoad(t);
 const label=(dBun,dJi,exact)=>exact?'입력과 일치':dBun===0?'같은 본번, 부번 '+dJi+' 차이':'본번 '+dBun+' 차이';
 function search(q){
  const p=parseQ(q),out=[];
  const road=p.rest.find(isRoad),dong=p.rest.find(isDong);
  const regs=p.rest.filter(t=>t!==road&&t!==dong);
  const gOK=(g,toks)=>toks.every(t=>G[g].includes(t));
  if(road&&p.lot){buildRoadIdx();const list=roadIdx.get(road)||[];const by=new Map();
   for(const i of list){const g=R[i][0];if(!gOK(g,regs))continue;const k=sgg(g);let a=by.get(k);if(!a)by.set(k,a=[]);a.push(i)}
   for(const [k,arr] of by){const c=arr.map(i=>{const t=R[i][4].split(' ')[1]||'',m=t.match(/^(\d+)(?:-(\d+))?/),mb=m?+m[1]:0,mj=m?+(m[2]||0):0;
     const db=Math.abs(mb-p.lot.bun),dj=Math.abs(mj-p.lot.ji);return{i,d:db*100000+dj,l:label(db,dj,db===0&&dj===0)}}).sort((a,b)=>a.d-b.d).slice(0,6);
    out.push({name:k+' '+road,count:arr.length,c})}
  }else if(dong){let gs=[];for(let g=0;g<G.length;g++){if(G[g].split(' ').includes(dong)&&gOK(g,regs))gs.push(g)}
   if(!gs.length)for(let g=0;g<G.length;g++){if(G[g].includes(dong)&&gOK(g,regs))gs.push(g)}
   for(const g of gs){const n=gE[g]-gS[g];let c=[];
    if(p.lot){for(let i=gS[g];i<gE[g];i++){const r=R[i];const db=Math.abs(r[1]-p.lot.bun),dj=Math.abs(r[2]-p.lot.ji);
      c.push({i,d:(r[3]!==p.lot.san?1e9:0)+db*100000+dj,l:label(db,dj,db===0&&dj===0&&r[3]===p.lot.san)})}
     c.sort((a,b)=>a.d-b.d);c=c.slice(0,6)}
    else{for(let i=gS[g];i<Math.min(gE[g],gS[g]+8);i++)c.push({i,d:0,l:'동 내 목록'})}
    out.push({name:G[g],count:n,c})}
  }else{const qq=p.raw.replace(/\s+/g,'');const c=[];
   for(let i=0;i<R.length&&c.length<30;i++){const r=R[i];const f=FD[i];const nm=(f&&f[3]&&f[3][0]&&f[3][0][0])||r[5];if(nm&&nm.replace(/\s+/g,'').includes(qq))c.push({i,d:0,l:'건물명 일치'})}
   if(c.length)out.push({name:'건물명 검색',count:c.length,c})}
  out.sort((a,b)=>(a.c[0]?a.c[0].d:9e12)-(b.c[0]?b.c[0].d:9e12)||b.count-a.count);
  return out.slice(0,5);
 }
 const bldOf=i=>{const f=FD[i];if(!f||!f[3]||!f[3].length)return null;return f[3].find(x=>x[1]>0)||f[3][0]};
 function brief(i){const r=R[i],b=bldOf(i);const nm=(b&&b[0])||r[5]||'(이름 없음)';
  return{i,name:nm,addr:addr(r),road:r[4]?sgg(r[0])+' '+r[4]:'',use:U[r[6]],up:b&&b[1]>0?b[1]:null,dn:b?b[2]:0,gfa:b&&b[3]?b[3]:0}}
 function fill(i){
  const r=R[i],b=bldOf(i),up=b&&b[1]>0?b[1]:null,dn=b?b[2]:0;
  const ground=up?Math.min(30,up):null,under=Math.min(5,dn||0);
  let gfa=b&&b[3]?b[3]:(r[10]?Math.round(r[10]/Math.max(r[11],1)):0);
  return{name:(b&&b[0])||r[5]||'',address:addr(r)+(r[4]?' ('+sgg(r[0])+' '+r[4]+')':''),use:useKey(U[r[6]]+','+E[r[7]]),ground,under,gfa,
   geoQ:r[4]?sgg(r[0])+' '+r[4]:G[r[0]]+' '+r[1]+(r[2]?'-'+r[2]:'')};
 }
 return{load,search,brief,fill,ready:()=>!!R};
})();
async function geocode(q){
 const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&accept-language=ko&q='+encodeURIComponent(q));
 if(!r.ok)throw new Error('좌표 서버 응답 오류 (HTTP '+r.status+')');
 const a=await r.json();if(!a.length)return null;return{lat:(+a[0].lat).toFixed(6),lng:(+a[0].lon).toFixed(6)};
}

 }

 let note='';

function reenc(src,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))};im.onerror=()=>res(null);im.src=src})}

 const j=A.jobs.find(x=>x.id===S.job);if(!j)return;
 const sm=summarize(),d=defects(sm),st={};FL.forEach(f=>st[f]=sm[f].state);
 const defKeys=new Set(d.map(x=>x.f+'|'+x.k)),extra=[];
 FL.forEach(f=>sm[f].items.forEach(x=>{if(x.st==='na')return;const r=rec(f,x.it.k);if(!defKeys.has(f+'|'+x.it.k))r.photos.forEach(p=>extra.push({f,name:CK[x.it.k].n,p}))}));
 const n=new Date(),loc=S.dist!=null?S.dist+' m · ±'+S.acc+' m':'위치 제한 없음';
 const prev=j.reportId&&A.reports.find(r=>r.id===j.reportId&&r.status==='보완 요청');
 const rep={id:prev?prev.id:'R-'+n.getFullYear().toString().slice(2)+pad(n.getMonth()+1)+pad(n.getDate())+'-'+rnd().toUpperCase(),ver:prev?(prev.ver||1)+1:1,jobId:j.id,bldId:j.bldId,bldName:j.bldName,ownerUid:j.ownerUid||'',inspUid:A.user.uid,inspName:A.user.name,at:stamp(),ts:Date.now(),status:'접수',loc,floors:FL.slice(),states:st,defects:d,extra,photoCount:d.reduce((a,x)=>a+x.photos.length,0)+extra.length,comment:'',sig:S.sig,insp:compactInsp(),fixes:{}};
 const size=()=>JSON.stringify(rep).length;
 if(size()>900000){
  const shrink=async(max,q)=>{for(const x of rep.defects)x.photos=await Promise.all(x.photos.map(p=>reenc(p,max,q).then(r=>r||p)));for(const e of rep.extra)e.p=await reenc(e.p,max,q).then(r=>r||e.p)};
  await shrink(480,.55);
  if(size()>900000)await shrink(320,.45);
  if(size()>980000)throw new Error('사진 용량이 너무 큽니다. 사진 수를 줄이고 다시 제출하세요.');
 }
 await D.set('reports',rep.id,rep);
 await D.update('jobs',j.id,{status:'제출됨',reportId:rep.id,submittedAt:Date.now(),insp:rep.insp,progress:{at:Date.now(),pct:100,states:st,def:d.length}});
 try{localStorage.removeItem(dkey(j.id))}catch(_){}
 S.submitted=rep.id;setMsg('결함 '+d.length+'건 · 사진 '+rep.photoCount+'장',true);stopGeo();
}

document.addEventListener('click',e=>{
 const t=e.target,c=s=>t.closest(s);let b;
 if(b=c('[data-ltab]')){S.login.tab=b.dataset.ltab;S.login.msg='';return render()}
 if(t.id==='reload')return location.reload();
 if(t.id==='logout')return doLogout();
 if(t.id==='pwbtn'){S.pwOpen=!S.pwOpen;setMsg('');return render()}
 if(t.id==='pwcancel'){S.pwOpen=false;return render()}
 if(b=c('[data-open]'))return openJob(b.dataset.open);
 if(b=c('[data-resp]')){const[id,v]=b.dataset.resp.split(':'),j=A.jobs.find(x=>x.id===id);if(!j||j.status!=='배정'||j.inspUid!==A.user.uid)return;
  if(v==='no'&&!confirm('이 배정을 거절할까요? 작업은 관리자에게 미배정으로 돌아갑니다.'))return;
  return guard(async()=>{if(v==='ok'){await D.update('jobs',j.id,{status:'수락',acceptedAt:Date.now()});setMsg('배정을 수락했습니다. 점검을 시작할 수 있습니다.',true)}
   else{await D.update('jobs',j.id,{status:'미배정',inspUid:'',inspName:'',declinedBy:A.user.name,declinedAt:Date.now()});setMsg('배정을 거절했습니다.',true)}})}
 if(b=c('[data-step]')){const s=+b.dataset.step;if(s===0)leaveJob();else S.step=s;return render()}
 if(b=c('[data-tab]')){S.tab=b.dataset.tab;setMsg('');return render()}
 if(b=c('[data-mk]')){if(moved>=4){moved=0;return}setFloor(b.dataset.f);S.focus=b.dataset.mk;render();if(S.role==='user')setTimeout(()=>{const x=document.getElementById('it-'+S.focus);x&&x.scrollIntoView({behavior:'smooth',block:'center'})},30);return}
 if(b=c('[data-fl]')){if(moved>=4){moved=0;return}setFloor(b.dataset.fl);return render()}
 if(b=c('[data-view]')){S.view=b.dataset.view;return render()}
 if(b=c('[data-lay]')){const k=b.dataset.lay;S.layers[k]=S.layers[k]===false;try{localStorage.setItem('fa-layers',JSON.stringify(S.layers))}catch(_){}return render()}
 if(b=c('[data-floor]')){setFloor(b.dataset.floor);return render()}
 if(b=c('[data-nav]')){if(b.dataset.nav){setFloor(b.dataset.nav);render();scrollTo(0,0)}return}
 if(t.id==='go2'){S.step=2;return render()}
 if(t.id==='go3'||t.id==='back2'){S.step=t.id==='go3'?3:2;return render()}
 if(b=c('[data-has]')){const r=rec(S.floor,b.dataset.has);r.has=b.dataset.v;if(r.has==='no')r.qty='0';return render()}
 if(b=c('[data-ck]')){const[k,i]=b.dataset.ck.split(':');rec(S.floor,k).r[+i]=+b.dataset.v;return render()}
 if(b=c('[data-del]')){const[k,i]=b.dataset.del.split(':');rec(S.floor,k).photos.splice(+i,1);return render()}
 if(b=c('[data-lb]')){const[k,i]=b.dataset.lb.split(':');return lightbox(rec(S.floor,k).photos[+i])}
 if(t.tagName==='IMG'&&t.dataset.src)return lightbox(t.dataset.src);
 if(t.id==='sigclear'){S.sig='';paintSig();const s=$('#submit');if(s)s.disabled=true;return}
 if(t.id==='submit'){if(S.busy)return;guard(submitReport);render();return}
 if(t.id==='again'){leaveJob();setMsg('');return render()}
 /* 관리자 */
 if(b=c('[data-rep]')){S.rep=b.dataset.rep;setMsg('');return render()}
 if(b=c('[data-act]')){const r=A.reports.find(x=>x.id===S.rep)||A.reports[0];if(!r)return;const st=b.dataset.act,cm=(($('#cmt')||{}).value||'').trim();
  if(!(NEXT[r.status]||[]).includes(st)){setMsg('"'+r.status+'" 상태에서는 "'+st+'" 처리를 할 수 없습니다.');return render()}
  if(st==='보완 요청'&&!cm){setMsg('보완 요청은 사유를 입력해야 합니다.');return render()}
  return guard(async()=>{await D.update('reports',r.id,{status:st,comment:cm,reviewedAt:Date.now(),reviewedBy:A.user.name});await D.update('jobs',r.jobId,{status:st==='승인'?'승인':st==='보완 요청'?'보완 요청':'제출됨'});setMsg('"'+st+'" 처리했습니다.',true)})}
 if(b=c('[data-print]'))return window.print();
 if(b=c('[data-jdel]')){const id=b.dataset.jdel;if(!armed('j:'+id))return;return guard(async()=>{await D.del('jobs',id)})}
 if(t.id==='bldnew'){S.bf=newBF();return render()}
 if(t.id==='bfcancel'){S.bf=null;S.lg=null;return render()}
 if(t.id==='lgsearch')return lgRun();
 if(b=c('[data-lgpick]'))return lgPick(b.dataset.lgpick);
 if(t.id==='bfgc'){const q=(S.bf.address||'').replace(/\s*\(.*\)\s*$/,'')||S.bf.name;if(!q){setMsg('주소를 먼저 입력하세요.');return render()}return guard(async()=>{const g=await geocode((S.bf.address.match(/\(([^)]+)\)/)||[])[1]||q);if(!g)throw new Error('좌표를 찾지 못했습니다. 건물 앞에서 현재 위치로 채우세요.');S.bf.lat=g.lat;S.bf.lng=g.lng;setMsg('지도 검색 좌표를 채웠습니다(근사). 건물 앞에서 현재 위치로 보정하세요.',true)})}
 if(b=c('[data-bldedit]')){const x=A.blds.find(y=>y.id===b.dataset.bldedit);if(x){S.bf=bfFrom(x);render()}return}
 if(b=c('[data-blddel]')){const id=b.dataset.blddel;if(!armed('b:'+id))return;return guard(async()=>{await D.del('buildings',id)})}
 if(t.id==='bfgeo'){if(!navigator.geolocation){setMsg('위치를 지원하지 않는 기기입니다.');return render()}navigator.geolocation.getCurrentPosition(p=>{S.bf.lat=p.coords.latitude.toFixed(6);S.bf.lng=p.coords.longitude.toFixed(6);setMsg('현재 위치를 좌표로 채웠습니다 (정확도 ±'+Math.round(p.coords.accuracy)+' m).',true);render()},()=>{setMsg('위치를 가져오지 못했습니다. 위치 권한을 확인하세요.');render()},{enableHighAccuracy:true,timeout:20000});return}
 if(b=c('[data-uact]')){const u=A.users.find(x=>x.uid===b.dataset.uact);if(!u)return;return guard(async()=>{await D.update('users',u.uid,{active:!u.active})})}
 /* 건물주 */
 if(b=c('[data-fix]')){const[rid,i]=b.dataset.fix.split(':');const r=A.reports.find(x=>x.id===rid);if(!r)return;const fx=Object.assign({},r.fixes||{});
  if(fx[i])delete fx[i];else{const note=((document.getElementById('fx-'+rid+'-'+i)||{}).value||'').trim();if(!note){setMsg('조치 내용을 입력해야 완료로 표시할 수 있습니다.');return render()}fx[i]=note}
  return guard(async()=>{await D.update('reports',rid,{fixes:fx})})}
});
document.addEventListener('submit',async e=>{
 const f=e.target,fid=f.getAttribute&&f.getAttribute('id');if(!fid)return;e.preventDefault();
 const fd=Object.fromEntries(new FormData(f).entries());
 if(fid==='fLogin'){
  const id=(fd.id||'').trim().toLowerCase();S.login.busy=true;S.login.msg='';render();
  try{
   const p=await D.login(id,fd.pw||'');const want={user:'inspector',admin:'admin',owner:'owner'}[S.login.tab];
   if(p.role!==want){await D.logout();S.login.msg='이 계정은 '+ROLES[p.role]+' 계정입니다. 위에서 "'+({inspector:'점검자',admin:'관리자',owner:'건물주'}[p.role])+'"를 선택해 로그인하세요.';S.login.busy=false;return render()}
   S.login.busy=false;return enter(p);
  }catch(err){S.login.busy=false;S.login.msg=emsg(err);render()}
  return;
 }
 if(fid==='fBoot'){
  const id=(fd.id||'').trim().toLowerCase();
  if(!ID_RE.test(id)){S.login.msg='아이디는 영문 소문자·숫자·._- 3~20자로 입력하세요.';return render()}
  S.login.busy=true;S.login.msg='';render();
  try{const p=await D.bootstrap({id,pw:fd.pw,name:(fd.name||'').trim()});S.login.busy=false;A.init=true;return enter(p)}
  catch(err){S.login.busy=false;S.login.msg=emsg(err);render()}
  return;
 }
 if(fid==='fPw'){return guard(async()=>{await D.changePw(fd.pw);S.pwOpen=false;setMsg('비밀번호를 변경했습니다.',true)})}
 if(fid==='fUser'){
  const id=(fd.id||'').trim().toLowerCase();
  if(!ID_RE.test(id)){setMsg('아이디는 영문 소문자·숫자·._- 3~20자로 입력하세요.');return render()}
  return guard(async()=>{await D.createUser({id,pw:fd.pw,name:(fd.name||'').trim(),role:fd.role,phone:(fd.phone||'').trim()});setMsg('"'+id+'" 계정을 만들었습니다. 아이디와 비밀번호를 본인에게 전달하세요.',true);f.reset&&f.reset()})
 }
 if(fid==='fBld'){
  const b=S.bf,g=Math.max(1,Math.min(30,+b.ground||1)),u=Math.max(0,Math.min(5,+b.under||0)),floors=mkFloors(g,u);
  if(!(b.name||'').trim()){setMsg('건물 이름을 입력하세요.');return render()}
  const lat=b.lat===''?null:parseFloat(b.lat),lng=b.lng===''?null:parseFloat(b.lng);
  if((lat==null)!==(lng==null)||(lat!=null&&(isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180))){setMsg('위도·경도를 둘 다 올바르게 입력하거나 둘 다 비워 두세요.');return render()}
  const areas={};floors.forEach(x=>areas[x]=Math.max(0,+b.areas[x]||0));
  const o={id:b.id||'B-'+Date.now().toString(36)+rnd(),name:b.name.trim(),address:(b.address||'').trim(),use:b.use,fire2:!!b.fire2,stairs:Math.max(1,Math.min(6,+b.stairs||2)),floors,areas,ownerUid:b.ownerUid||'',lat,lng,radius:Math.max(20,+b.radius||100),ts:Date.now()};
  return guard(async()=>{await D.set('buildings',o.id,o);S.bf=null;setMsg('건물을 저장했습니다.',true)});
 }
 if(fid==='fJob'){
  const b=A.blds.find(x=>x.id===fd.bld);if(!b)return;const ins=A.users.find(x=>x.uid===fd.insp);
  const j={id:'J-'+Date.now().toString(36)+rnd(),bldId:b.id,bldName:b.name,ownerUid:b.ownerUid||'',bld:{name:b.name,address:b.address||'',use:b.use,fire2:!!b.fire2,stairs:b.stairs,floors:b.floors,areas:b.areas,lat:b.lat==null?null:b.lat,lng:b.lng==null?null:b.lng,radius:b.radius||100},date:fd.date,note:(fd.note||'').trim(),inspUid:ins?ins.uid:'',inspName:ins?ins.name:'',status:ins?'배정':'미배정',createdAt:Date.now(),progress:{pct:0,states:{},def:0,at:0}};
  return guard(async()=>{await D.set('jobs',j.id,j);setMsg('작업을 만들었습니다.',true)});
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.lgq!==undefined){e.preventDefault();lgRun()}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.lgq!==undefined){(S.lg||(S.lg={})).q=t.value;return}
 if(t.dataset.bf!==undefined&&S.bf){S.bf[t.dataset.bf]=t.value;return}
 if(t.dataset.bfa!==undefined&&S.bf){S.bf.areas[t.dataset.bfa]=t.value;return}
 if(t.dataset.note!==undefined&&t.tagName==='TEXTAREA'){rec(S.floor,t.dataset.note).note=t.value;persist()}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.bfn&&S.bf){S.bf[t.dataset.bfn]=Math.max(t.dataset.bfn==='ground'?1:0,Math.min(t.dataset.bfn==='ground'?30:5,+t.value||0));const fl=mkFloors(+S.bf.ground,+S.bf.under);fl.forEach(x=>{if(S.bf.areas[x]==null)S.bf.areas[x]=300});return render()}
 if(t.dataset.bfc&&S.bf){S.bf[t.dataset.bfc]=t.checked;return}
 if(t.dataset.bf==='use'||t.dataset.bf==='ownerUid'){S.bf[t.dataset.bf]=t.value;return}
 if(t.id==='gap'){S.gap=+t.value;return render()}
 if(t.id==='ack'){S.ack=t.checked;return render()}
 if(t.id==='jobsel'){S.jobSel=t.value;return render()}
 if(t.dataset.job){const id=t.dataset.job,u=A.users.find(x=>x.uid===t.value);return guard(async()=>{await D.update('jobs',id,{inspUid:u?u.uid:'',inspName:u?u.name:'',status:u?'배정':'미배정'})})}
 if(t.dataset.qty){rec(S.floor,t.dataset.qty).qty=t.value;return render()}
 if(t.dataset.file){const k=t.dataset.file;for(const f of t.files){const d=await resizePhoto(f,640,.65);if(d)rec(S.floor,k).photos.push(d)}render()}
});

/* ================= 시작 ================= */
(async function boot(){
 render();
 try{D=FB;A.mode=await FB.init()}
 catch(e){A.fbErr=e.message;if(hostIsFirebase()){A.mode='blocked';return render()}D=Local;A.mode=await Local.init()}
 try{A.init=await D.initialized()}catch(e){A.err=emsg(e);return render()}
 try{const p=await D.restore();if(p)return enter(p)}catch(_){}
 render();
})();
})();
