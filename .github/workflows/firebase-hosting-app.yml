name: Deploy phone app (checkfires-app)
on:
  push:
    branches:
      - main
    paths:
      - 'm/**'
      - 'firebase.json'
      - '.firebaserc'
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHECKFIRES }}
          channelId: live
          projectId: checkfires
          target: app
