name: Deploy Firestore rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['firestore.rules']
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHECKFIRES }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore:rules --project checkfires --non-interactive
