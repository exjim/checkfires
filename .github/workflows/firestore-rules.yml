name: Deploy Firestore rules
on:
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy rules
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHECKFIRES }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "::notice title=SERVICE_ACCOUNT::$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('client_email'),d.get('project_id'))" "$RUNNER_TEMP/sa.json")"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          OUT=$(npx -y firebase-tools@13 deploy --only firestore:rules --project checkfires --non-interactive 2>&1)
          RC=$?
          echo "$OUT"
          MSG=$(echo "$OUT" | grep -iE "error|denied|permission|403|not found|disabled" | head -5 | tr '\n' ' ' | sed 's/%/%25/g')
          if [ $RC -ne 0 ]; then echo "::error title=RULES_DEPLOY_FAILED::${MSG:-$(echo "$OUT" | tail -3 | tr '\n' ' ')}"; exit 1; fi
